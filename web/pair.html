<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Lunitide 移动伴侣 · 配对</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: #0b0e14; color: #e8eaf0; min-height: 100dvh;
        display: flex; align-items: center; justify-content: center; padding: 24px;
      }
      .pair-card { width: 100%; max-width: 360px; text-align: center; }
      .pair-logo { width: 84px; height: 84px; border-radius: 22px; margin: 0 auto 18px; display: block; box-shadow: 0 8px 32px rgba(96,140,255,.25); }
      h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
      .pair-sub { font-size: 14px; color: #9aa3b5; margin-bottom: 26px; line-height: 1.6; }
      .fp-box {
        background: #131826; border: 1px solid #232b3f; border-radius: 12px;
        padding: 14px 16px; margin-bottom: 18px; font-size: 13px; color: #9aa3b5; line-height: 1.7;
      }
      .fp-box code { color: #7ea2ff; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .5px; }
      input[type='text'] {
        width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid #232b3f;
        background: #131826; color: #e8eaf0; font-size: 15px; outline: none; margin-bottom: 12px;
      }
      input[type='text']:focus { border-color: #4a6cf7; }
      input::placeholder { color: #5b647a; }
      .pair-btn {
        width: 100%; padding: 14px; border: none; border-radius: 12px; background: #4a6cf7;
        color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
      }
      .pair-btn:disabled { opacity: .55; }
      .pair-btn.success { background: #2ea469; }
      .pair-error { color: #ff8d8d; font-size: 13px; min-height: 20px; margin: 10px 0; line-height: 1.5; }
      .pair-hint { font-size: 12px; color: #5b647a; margin-top: 18px; line-height: 1.7; }
      .pair-open {
        display: inline-block; margin-top: 16px; padding: 12px 28px; border-radius: 12px;
        background: #2ea469; color: #fff; font-size: 15px; font-weight: 600;
        text-decoration: none;
      }
      .spinner {
        display: inline-block; width: 15px; height: 15px; vertical-align: -3px; margin-right: 8px;
        border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%;
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pair/pairEntry.tsx"></script>
  </body>
</html>
