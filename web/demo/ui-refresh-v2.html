<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lunitide 界面提案</title>
<style>
  :root {
    --bg:#000; --ink:#eaf3ff; --muted:#8fa3bf;
    --rule:rgba(143,163,191,.16); --line:rgba(143,163,191,.25);
    --tide1:#3bd6ff; --tide2:#7f5bff; --tide3:#2fd6b5;
    --side:#030406; --card:#070b12;
    --sans:"Inter","Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif;
  }
  html[data-theme="light"] {
    --bg:#fff; --ink:#1a1a1a; --muted:#5c5c5c;
    --rule:rgba(0,0,0,.12); --line:rgba(0,0,0,.2);
    --tide1:#008ac5; --tide2:#5036d0; --tide3:#00997c;
    --side:#f4f4f4; --card:#fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font-family: var(--sans); }
  html[data-theme="light"] body { background: #fff; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .app { display: grid; grid-template-columns: 268px 1fr; height: 100%; }
  aside {
    position: relative; z-index: 2; display: flex; flex-direction: column;
    padding: 14px 12px 12px; background: var(--side); border-right: 1px solid rgba(137,160,198,.12); min-height: 0;
  }
  html[data-theme="light"] aside { border-color: var(--rule); }
  .switch { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .drawer { width: 32px; height: 32px; border: 1px solid #3a3a3a; border-radius: 10px; background: #171717; color: #f4f4f4; }
  html[data-theme="light"] .drawer { border-color: #e4e4e4; background: #fff; color: #111; }
  .pills { flex: 1; display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 999px; background: #141414; gap: 2px; }
  html[data-theme="light"] .pills { background: #ececec; }
  .pills button { min-height: 32px; border: 0; border-radius: 999px; background: transparent; color: #8a8a8a; }
  .pills button[aria-pressed="true"] { color: #f4f4f4; background: #1a1a1a; box-shadow: inset 0 0 0 1px #2a2a2a; }
  html[data-theme="light"] .pills button { color: #6a6a6a; }
  html[data-theme="light"] .pills button[aria-pressed="true"] { color: #111; background: #fff; box-shadow: inset 0 0 0 1px #e4e4e4; }
  .act, .row {
    display: flex; align-items: center; gap: 8px; width: 100%; height: 34px; padding: 0 10px;
    border: 0; border-radius: 8px; background: transparent; color: #d9e3f2; font-size: 13.5px; text-align: left;
  }
  html[data-theme="light"] .act, html[data-theme="light"] .row { color: var(--muted); }
  .act { justify-content: space-between; margin-bottom: 2px; }
  .act kbd { color: #74849c; font-size: 11px; font-family: inherit; }
  .act:hover, .row:hover { background: rgba(121,160,224,.09); }
  .row.on { background: rgba(121,160,224,.16); color: #fff; }
  html[data-theme="light"] .row.on { background: rgba(0,138,197,.1); color: var(--ink); }
  .group { margin-top: 12px; }
  .group h2 { margin: 0; padding: 0 10px 6px; font-size: 12px; font-weight: 650; color: #91a2ba; }
  .chats { max-height: 132px; overflow: auto; }
  .chat { padding: 7px 10px; border-radius: 8px; color: #c5d4ea; font-size: 13px; }
  .lamp { width: 6px; height: 6px; border-radius: 50%; background: var(--tide3); box-shadow: 0 0 6px rgba(47,214,181,.55); flex: none; }
  .grow { flex: 1; }
  .foot { display: grid; grid-template-columns: 1fr 40px 58px; gap: 5px; padding-top: 9px; border-top: 1px solid rgba(137,159,194,.12); }
  .foot button { min-height: 40px; border: 1px solid rgba(137,159,194,.16); border-radius: 8px; background: rgba(255,255,255,.025); }
  html[data-theme="light"] .foot button { background: #fff; border-color: var(--rule); }
  .who { display: flex; align-items: center; gap: 8px; padding: 0 8px; justify-content: flex-start; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: #315b94; color: #fff; font-size: 11px; }
  .who b { font-size: 12px; }
  main { position: relative; min-width: 0; overflow: auto; background: #000; }
  html[data-theme="light"] main { background: #fff; }
  #aurora { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .layer { position: relative; z-index: 1; }
  .home { min-height: 100%; display: grid; place-items: center; padding: 48px 7% 64px; }
  .home-card { width: min(760px, 100%); text-align: center; }
  h1.hero { margin: 0 0 8px; font-size: clamp(26px, 2.6vw, 36px); font-weight: 650; letter-spacing: -.025em; }
  .lead { margin: 0 0 22px; color: #92a2ba; font-size: 14px; }
  .composer { text-align: left; padding: 15px 16px 12px; border: 1px solid rgba(255,255,255,.08); border-radius: 18px; background: #252525; }
  html[data-theme="light"] .composer { background: #fff; border-color: var(--rule); }
  .ph { min-height: 56px; color: #757575; font-size: 16px; }
  .bar { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .send { margin-left: auto; width: 32px; height: 32px; border: 0; border-radius: 999px; background: #d8d8d8; color: #1a1a1a; font-weight: 700; }
  .cards3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
  .cards3 button { display: block; min-height: 74px; padding: 14px 16px; text-align: left; border: 1px solid rgba(137,159,194,.18); border-radius: 12px; background: rgba(8,13,23,.44); }
  .cards3 b { display: block; margin-bottom: 4px; font-size: 13.5px; }
  .cards3 span { color: #8293af; font-size: 12px; line-height: 1.5; }
  .page { padding: 26px 32px 48px; }
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .page-head h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
  .page-head p { margin: 6px 0 0; color: var(--muted); font-size: 13px; max-width: 640px; line-height: 1.5; }
  .solid { height: 34px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--tide1); color: #041018; font-weight: 650; white-space: nowrap; }
  html[data-theme="light"] .solid { color: #fff; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
  .tabs { display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: rgba(255,255,255,.04); }
  html[data-theme="light"] .tabs { background: #f0f0f0; }
  .tabs button { height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 13px; }
  .tabs button.on { background: rgba(59,214,255,.14); color: var(--ink); }
  .search, select.f {
    height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink); font-size: 13px;
  }
  .search { min-width: 180px; }
  .iconbtn { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 8px; background: transparent; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chips button { height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--rule); background: transparent; color: var(--muted); font-size: 12.5px; }
  .chips button.on { border-color: rgba(59,214,255,.45); background: rgba(59,214,255,.1); color: var(--ink); }
  .split { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 12px; min-height: 420px; }
  .lib { border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
  .lib button.item {
    display: grid; grid-template-columns: 1fr 64px 72px; gap: 8px; width: 100%; padding: 12px 14px;
    border: 0; border-bottom: 1px solid var(--rule); background: transparent; text-align: left;
  }
  .lib button.item.on { background: rgba(59,214,255,.08); }
  .lib b { display: block; font-size: 14px; }
  .lib small { color: var(--muted); font-size: 12px; }
  .badge { justify-self: start; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; line-height: 22px; background: rgba(59,214,255,.12); color: var(--tide1); }
  .detail { padding: 16px; border: 1px solid var(--rule); border-radius: 12px; background: var(--card); }
  .detail h2 { margin: 0 0 6px; font-size: 18px; }
  .detail p { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .detail h3 { margin: 16px 0 8px; font-size: 12px; color: #91a2ba; }
  .perms { display: flex; flex-wrap: wrap; gap: 6px; }
  .perms span { padding: 3px 8px; border-radius: 999px; border: 1px solid var(--rule); font-size: 12px; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .actions button, .rowacts button {
    height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; font-size: 12.5px;
  }
  .actions button.pri, .rowacts button.pri { border-color: transparent; background: var(--tide1); color: #041018; font-weight: 650; }
  .market { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
  .skill, .mcp {
    border: 1px solid var(--rule); border-radius: 12px; background: var(--card);
  }
  .skill { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: start; padding: 14px; }
  .skill:hover, .mcp:hover { border-color: rgba(59,214,255,.45); }
  .glyph {
    width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #041018; font-weight: 700;
    background: linear-gradient(145deg, #7CFF67, #5227FF);
  }
  .skill b, .mcp b { font-size: 14px; font-weight: 650; }
  .skill small, .mcp p { display: block; margin-top: 4px; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
  .src { margin-top: 6px; color: var(--tide1); font-size: 11px; }
  .install { height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid rgba(59,214,255,.4); background: rgba(59,214,255,.08); color: var(--tide1); font-size: 12.5px; }
  .footline { grid-column: 1 / -1; display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
  .mcp-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
  .mcp { position: relative; min-height: 132px; padding: 14px; }
  .mcp .plus { position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 7px; border: 1px solid rgba(59,214,255,.4); background: transparent; color: var(--tide1); }
  .installed { display: grid; gap: 8px; }
  .inst {
    display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center;
    padding: 14px 16px; border: 1px solid var(--rule); border-radius: 12px; background: var(--card);
  }
  .inst small { color: var(--muted); font-size: 12px; }
  .pm-top { display: grid; grid-template-columns: 1fr 300px; gap: 20px; align-items: start; margin-bottom: 8px; }
  .art { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--rule); background: #070b12; }
  html[data-theme="light"] .art { background: #f7fbff; }
  .art svg { display: block; width: 100%; height: auto; }
  .find { position: absolute; left: 12px; right: 12px; bottom: 12px; height: 34px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(59,214,255,.35); background: rgba(4,10,18,.72); color: #9ec9e6; font-size: 13px; }
  .plist { display: grid; gap: 8px; margin-top: 12px; }
  .prow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 12px; background: var(--card); }
  .prow b { font-size: 14px; }
  .prow small { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
  .meta { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .meta i { font-style: normal; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--rule); font-size: 11px; color: var(--muted); }
  .rowacts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .note { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
  @media (max-width: 1100px) {
    .market, .mcp-grid, .cards3 { grid-template-columns: 1fr 1fr; }
    .split, .pm-top { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="switch">
      <button class="drawer" type="button" aria-label="收起左侧栏">◧</button>
      <div class="pills" role="group" aria-label="Chat / Work">
        <button type="button" id="mode-chat" aria-pressed="true">Chat</button>
        <button type="button" id="mode-work" aria-pressed="false">Work</button>
      </div>
    </div>
    <div id="nav"></div>
    <div class="grow"></div>
    <div class="foot">
      <button class="who" type="button"><span class="avatar">Mu</span><b>Mr.Mu</b></button>
      <button type="button" id="theme" aria-label="切换黑白">☀</button>
      <button type="button" aria-label="切换到英文">中/EN</button>
    </div>
  </aside>
  <main>
    <canvas id="aurora" aria-hidden="true"></canvas>
    <div class="layer" id="stage"></div>
  </main>
</div>
<script>
const office = ['办公工作台','自动化','媒体中心','同事聊天','会议记录','产品总览'];
const tools = [['projects','项目管理'],['skill','技能中心'],['expert','专家中心'],['mcp','MCP'],['plugins','插件'],['assets','资产管理']];
const library = [
  { name:'文档写作', desc:'按版式写出 Word，保留标题、表格和批注。', ver:'1.4', status:'已发布', perm:['读写','文件系统'], trigger:'写文档、周报、Word' },
  { name:'演示文稿', desc:'生成可放映的幻灯片。', ver:'1.2', status:'已发布', perm:['读写'], trigger:'做 PPT、演示文稿' },
  { name:'头脑风暴', desc:'先把问题问清楚，再决定做什么。', ver:'0.9', status:'草稿', perm:['只读'], trigger:'帮我想想、头脑风暴' }
];
const marketSkills = [
  ['文','文档写作','按版式写出 Word。','Lunitide · 办公','v1.4','读写'],
  ['演','演示文稿','生成可放映的幻灯片。','Lunitide · 办公','v1.2','读写'],
  ['表','数据表格','整理指标和可筛选的工作表。','Lunitide · 办公','v1.1','读写'],
  ['设','界面设计','按产品气质出界面。','社区','v2.0','只读'],
  ['技','技能创建','把一次做法收成可复用技能。','社区','v1.0','读写'],
  ['查','数据查询','用 SQL 看本地表。','DuckDB','v0.8','只读']
];
const installedMcp = [
  { name:'工作区文件', line:'本地 stdio · 市场 · npx @modelcontextprotocol/server-filesystem', status:'已连接' },
  { name:'桌面浏览器', line:'本地 stdio · 策展预置 playwright', status:'连接异常' }
];
const mcpMarket = [
  ['文','工作区文件','读写当前项目里的文档和代码。','文件系统 · 免密钥'],
  ['览','桌面浏览器','打开页面、读取内容并继续点击。','浏览器'],
  ['仓','代码仓库','查看提交、差异和只读历史。','开发 · 免密钥'],
  ['搜','网页检索','按问题找公开资料，并标出来源。','检索'],
  ['库','本地数据','查询项目里的表和导出结果。','数据'],
  ['历','日历日程','读取会议时间，方便写纪要。','效率']
];
const projects = [
  { name:'在线商城实施', code:'ITM00018', client:'华北零售', type:'实施项目', status:'立项', range:'2026-03-01 ~ 2026-06-30', workbench:true },
  { name:'机务手册检索', code:'ITM00021', client:'内部', type:'增强项目', status:'创建', range:'2026-04-01 ~ 2026-08-15', workbench:false }
];
let mode = 'chat', view = 'home', skillTab = 'market', skillId = 0, mcpTab = 'market', q = '';

function nav() {
  if (mode === 'chat') {
    return `<button class="act" type="button" data-go="home">＋ 新对话<kbd>Ctrl N</kbd></button>
      <button class="act" type="button">搜索<kbd>Ctrl K</kbd></button>
      <div class="group"><h2>› 对话</h2><div class="chats"><div class="chat">月伴对话</div><div class="chat">试用技能：POC 快速构建</div></div></div>
      <div class="group"><h2>⌄ 办公</h2>${office.map(n=>`<button class="row" type="button" data-go="home">${n}</button>`).join('')}</div>`;
  }
  return `<button class="act" type="button">＋ 新对话</button>
    <div class="group"><h2>历史对话</h2><div class="chats"><div class="chat">Cursor</div><div class="chat">Codex</div><div class="chat">Kimi</div></div></div>
    <div class="group"><h2>⌄ 项目</h2>${tools.map(([id,name])=>`<button class="row${view===id?' on':''}" data-go="${id}" type="button"><i class="lamp"></i>${name}</button>`).join('')}</div>`;
}
function home() {
  return `<div class="home"><div class="home-card">
    <h1 class="hero">今天想聊什么？</h1>
    <p class="lead">直接开始对话。需要写文件时再下手，再送入队列。</p>
    <div class="composer"><div class="ph">向月汐提问，或描述你想完成的事情。</div>
      <div class="bar"><span>＋</span><span>完全访问</span><button class="send" type="button">↑</button><span>GLM-5.3</span></div></div>
    <div class="cards3">
      <button type="button"><b>月伴对话</b><span>纯语音交流：听我说、问问题、像聊天一样。</span></button>
      <button type="button" data-go="projects"><b>项目管理</b><span>创建、立项和项目任务清单。</span></button>
      <button type="button"><b>恢复对话</b><span>打开最近一次未结束的对话。</span></button>
    </div></div></div>`;
}
function skillPage() {
  const skill = library[skillId];
  const lib = `<div class="split"><div class="lib">${library.map((s,i)=>`<button class="item${i===skillId?' on':''}" data-skill="${i}" type="button"><span><b>${s.name}</b><small>${s.desc}</small></span><code>v${s.ver}</code><span class="badge">${s.status}</span></button>`).join('')}</div>
    <aside class="detail"><h2>${skill.name}</h2><p>${skill.desc}</p><h3>权限清单</h3><div class="perms">${skill.perm.map(p=>`<span>${p}</span>`).join('')}</div><h3>触发器</h3><p><code>${skill.trigger}</code></p>
    <div class="actions"><button type="button">在对话中使用</button><button type="button">编辑技能</button><button class="pri" type="button">安装并正式发布</button><button type="button">弃用</button><button type="button">禁用</button><button type="button">删除</button></div></aside></div>`;
  const mkt = `<div class="chips"><button class="on" type="button">全部</button><button type="button">内容</button><button type="button">开发</button><button type="button">数据</button></div>
    <div class="market">${marketSkills.map(s=>`<article class="skill"><span class="glyph">${s[0]}</span><div><b>${s[1]}</b><small>${s[2]}</small><div class="src">${s[3]}</div><div class="footline"><span>${s[4]}</span><span>${s[5]}</span></div></div><button class="install" type="button">安装</button></article>`).join('')}</div>`;
  return `<div class="page"><div class="page-head"><div><h1>技能中心</h1><p>2 个已发布 · 1 个草稿 · 市场 12 个可选技能。市场按需安装；自己创建或导入的先是草稿，试用后再发布。</p></div><button class="solid" type="button">＋ 添加技能</button></div>
    <div class="toolbar"><div class="tabs" role="tablist"><button type="button" class="${skillTab==='library'?'on':''}" data-stab="library">技能库</button><button type="button" class="${skillTab==='market'?'on':''}" data-stab="market">技能市场</button></div>
    ${skillTab==='library'?`<div class="tabs"><button class="on" type="button">全部</button><button type="button">草稿</button><button type="button">已发布</button><button type="button">已弃用</button><button type="button">已禁用</button></div><input class="search" placeholder="搜索技能" aria-label="搜索技能"/>`: `<input class="search" placeholder="名称、分类或来源" aria-label="搜索市场"/>`}<button class="iconbtn" type="button" aria-label="刷新">↻</button></div>
    ${skillTab==='library'?lib:mkt}</div>`;
}
function mcpPage() {
  const list = `<div class="installed">${installedMcp.map(m=>`<article class="inst"><div><b>${m.name}</b><small>${m.line}</small></div><div><span class="badge">${m.status}</span><div class="rowacts" style="margin-top:8px"><button type="button">凭据</button><button type="button">重新连接</button><button class="pri" type="button">检查并修复</button><button type="button">删除</button></div></div></article>`).join('')}</div>`;
  const mkt = `<div class="chips"><button class="on" type="button">全部</button><button type="button">文件系统</button><button type="button">浏览器</button><button type="button">开发</button></div>
    <div class="mcp-grid">${mcpMarket.map(m=>`<article class="mcp"><span class="glyph">${m[0]}</span><button class="plus" type="button" aria-label="安装 ${m[1]}">+</button><b>${m[1]}</b><p>${m[2]}</p><div class="src">${m[3]}</div></article>`).join('')}</div>`;
  return `<div class="page"><div class="page-head"><div><h1>MCP</h1><p>已安装 2 个 · 市场 8 个可点选安装 · 已连接 1 · 失败 1。市场点加号即可。也可以手动填写 JSON。</p></div><button class="solid" type="button">＋ 创建 MCP</button></div>
    <div class="toolbar"><div class="tabs"><button type="button" class="${mcpTab==='installed'?'on':''}" data-mtab="installed">已安装（2）</button><button type="button" class="${mcpTab==='market'?'on':''}" data-mtab="market">MCP 市场</button></div>
    <input class="search" placeholder="${mcpTab==='market'?'名称或分类':'已安装 MCP'}"/><button class="iconbtn" type="button" aria-label="刷新 MCP">↻</button></div>
    <p class="note">有 1 个 MCP 无法握手。点「检查并修复」对照当前市场版本重装。</p>
    ${mcpTab==='installed'?list:mkt}</div>`;
}
function projectPage() {
  const rows = projects.filter(p => !q || `${p.name}${p.code}${p.client}`.includes(q));
  return `<div class="page"><div class="pm-top"><div>
      <p style="margin:0;color:var(--tide1);font-size:11px;letter-spacing:.08em">PROJECT MANAGEMENT</p>
      <h1 style="margin:6px 0 0;font-size:26px">项目管理</h1>
      <p class="lead">管理项目的完整生命周期：创建、发布、进入工作台、关闭与归档。</p>
    </div>
    <aside class="art" aria-label="协作插画"><svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg"><rect width="640" height="280" fill="#070b12"/>
      <g fill="none" stroke="#7CFF67" stroke-width="1.6" stroke-linecap="round"><path d="M40 210c90 20 180 24 300 8 80-10 150 0 250 18" stroke="#5227FF"/><circle cx="120" cy="120" r="14"/><rect x="150" y="150" width="70" height="40" rx="4"/><circle cx="280" cy="108" r="14"/><rect x="250" y="146" width="78" height="44" rx="4"/><circle cx="430" cy="104" r="13"/><rect x="400" y="142" width="66" height="38" rx="4"/></g></svg>
      <div class="find">搜索项目</div></aside>
    </div>
    <div class="toolbar"><b style="font-size:14px">项目清单</b>
      <input class="search" id="pq" aria-label="搜索项目" placeholder="搜索项目名称、ITM编号或客户…" value="${q}"/>
      <select class="f" aria-label="筛选项目类型"><option>全部类型</option><option>实施项目</option><option>运维项目</option><option>增强项目</option></select>
      <select class="f" aria-label="筛选项目状态"><option>全部状态</option><option>创建</option><option>立项</option><option>实施中</option><option>项目关闭</option></select>
      <button class="iconbtn" type="button" aria-label="刷新项目">↻</button>
      <button class="solid" type="button">＋ 创建项目</button>
    </div>
    <p class="note">动作门禁：创建状态仅可修改、发布或删除；发布后才能进入工作台。关闭需填写原因，关闭后只读。</p>
    <div class="plist">${rows.map(p=>`<article class="prow"><div><b>${p.name}</b><small>${p.code} · ${p.client} · ${p.range}</small><div class="meta"><i>${p.type}</i><i>${p.status}</i></div></div>
      <div class="rowacts">${p.workbench?'<button class="pri" type="button">进入工作台</button>':'<button class="pri" type="button">发布</button>'}<button type="button">修改</button><button type="button">关闭</button><button type="button">删除</button></div></article>`).join('')}</div></div>`;
}
function stub(title, text) {
  return `<div class="page"><div class="page-head"><div><h1>${title}</h1><p>${text}</p></div></div></div>`;
}
function stage() {
  if (view==='skill') return skillPage();
  if (view==='mcp') return mcpPage();
  if (view==='projects') return projectPage();
  if (view==='expert') return stub('专家中心','岗位、技能和 MCP 的勾选还在。这里只换字号和行距。');
  if (view==='plugins') return stub('插件','组合包、门闸和启用状态还在。这里只换字号和行距。');
  if (view==='assets') return stub('资产管理','上传、搜索和模版列表还在。这里只换字号和行距。');
  return home();
}
function paint() {
  document.getElementById('mode-chat').setAttribute('aria-pressed', String(mode==='chat'));
  document.getElementById('mode-work').setAttribute('aria-pressed', String(mode==='work'));
  document.getElementById('nav').innerHTML = nav();
  document.getElementById('stage').innerHTML = stage();
  document.getElementById('aurora').style.display = view==='home' ? 'block' : 'none';
  document.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', () => {
    const go = el.dataset.go;
    if (go==='home') { mode='chat'; view='home'; }
    else { mode='work'; view=go; }
    paint();
  }));
  document.querySelectorAll('[data-stab]').forEach(el => el.addEventListener('click', () => { skillTab = el.dataset.stab; paint(); }));
  document.querySelectorAll('[data-mtab]').forEach(el => el.addEventListener('click', () => { mcpTab = el.dataset.mtab; paint(); }));
  document.querySelectorAll('[data-skill]').forEach(el => el.addEventListener('click', () => { skillId = Number(el.dataset.skill); paint(); }));
  const pq = document.getElementById('pq');
  if (pq) pq.addEventListener('input', () => { q = pq.value.trim(); paint(); const again = document.getElementById('pq'); if (again) { again.focus(); again.setSelectionRange(q.length, q.length); } });
}
document.getElementById('mode-chat').onclick = () => { mode='chat'; view='home'; paint(); };
document.getElementById('mode-work').onclick = () => { mode='work'; if (view==='home') view='projects'; paint(); };
document.getElementById('theme').onclick = () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  document.getElementById('theme').textContent = next === 'light' ? '☾' : '☀';
};
const canvas = document.getElementById('aurora');
const ctx = canvas.getContext('2d');
function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  const dpr = Math.min(2, devicePixelRatio || 1);
  canvas.width = Math.max(1, r.width * dpr);
  canvas.height = Math.max(1, r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function ribbon(w, h, t, yBase, color, amp) {
  ctx.beginPath();
  ctx.moveTo(0, h);
  for (let x = 0; x <= w; x += 8) {
    const y = yBase + Math.sin(x * 0.006 + t) * amp + Math.sin(x * 0.015 - t * 0.7) * amp * 0.35;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w, 0); ctx.lineTo(0, 0); ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
}
function render(now) {
  const light = document.documentElement.dataset.theme === 'light';
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const dpr = Math.min(2, devicePixelRatio || 1);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = light ? '#ffffff' : '#000000';
  ctx.fillRect(0, 0, w, h);
  if (canvas.style.display !== 'none') {
    const t = now * 0.0009;
    ctx.save();
    ctx.filter = 'blur(42px)';
    ctx.globalCompositeOperation = light ? 'multiply' : 'screen';
    ctx.globalAlpha = light ? 0.62 : 0.9;
    ribbon(w, h, t, h * 0.28, '#5227FF', 90);
    ribbon(w, h, t * 1.3 + 1.2, h * 0.12, '#7CFF67', 72);
    ribbon(w, h, t * 0.8 + 2.1, h * 0.2, light ? '#00d8ff' : '#7CFF67', 48);
    ctx.restore();
  }
}
function draw(now) { render(now); requestAnimationFrame(draw); }
window.__render = render;
addEventListener('resize', resize);
resize();
requestAnimationFrame(draw);
paint();
</script>
