<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>0.4 首页月亮预览</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #071018; color: #edf3ff; font: 15px/1.5 "Segoe UI", sans-serif; }
  body { display: grid; place-items: center; min-height: 100vh;
    background:
      radial-gradient(900px 520px at 50% 18%, rgba(40, 160, 90, .45), transparent 58%),
      radial-gradient(700px 480px at 70% 30%, rgba(40, 70, 160, .35), transparent 60%),
      linear-gradient(180deg, #0c2418 0%, #10243a 48%, #1a2048 100%);
  }
  main { width: min(720px, 92vw); text-align: center; }
  p.note { color: #9eb0c6; font-size: 13px; }
  .stage { display: flex; flex-direction: column; align-items: center; margin: 28px 0 8px; }
  h1 { margin: 0 0 8px; font-weight: 650; letter-spacing: -.025em; font-size: 32px; }
  .lead { margin: 0; color: #92a2ba; font-size: 14px; }

  /* Copied from v0.4.14 web/src/styles.css: the home moon above 今天想聊什么. */
  .real-moon { display: block; position: relative; border-radius: 50%;
    background: radial-gradient(circle at 36% 32%, #fff 0%, #f2f7ff 26%, #c8daf5 64%, #88a9d8 100%);
    box-shadow: 0 0 16px rgba(117, 168, 237, .38);
    overflow: visible; isolation: isolate;
    width: 68px; height: 68px; margin: 0 auto 34px;
    animation: moonFloat 8s ease-in-out infinite;
  }
  .real-moon::before { content: ""; position: absolute; inset: -70%; z-index: -1; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, transparent 36%, rgba(255, 250, 246, .52) 41.7%, rgba(236, 244, 255, .2) 48%, rgba(200, 226, 255, .08) 62%, transparent 82%);
    filter: blur(11px);
  }
  .launch-center > .real-moon,
  .about-logo > .real-moon { display: block; }
  .launch-center > .real-moon { width: 42px; height: 42px; margin: 0 auto 16px; }
  .launch-center > .real-moon::before { inset: -58%; filter: blur(6px);
    background: radial-gradient(circle, transparent 37%, rgba(255, 250, 246, .42) 42%, rgba(220, 236, 255, .12) 56%, transparent 78%);
  }
  .about-logo { display: flex; align-items: center; gap: 14px; justify-content: center; margin-top: 36px; }
  .about-logo > .real-moon { width: 40px; height: 40px; margin: 0; }
  .about-logo h3 { margin: 0; font-weight: 500; font-size: 22px; }
  @keyframes moonFloat { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  .zoom { transform: scale(3.2); margin: 72px auto 96px; }
</style>
</head>
<body>
<main>
  <p class="note">首页和关于页用的是这枚月亮：光圈，8 秒上下浮一次。</p>
  <div class="stage launch-center">
    <span class="real-moon" aria-hidden="true"></span>
    <h1>今天想聊什么？</h1>
    <p class="lead">首页，42×42，带光圈，上下浮动。</p>
  </div>
  <div class="about-logo">
    <span class="real-moon" aria-hidden="true"></span>
    <h3>月汐</h3>
  </div>
  <p class="note">关于页，40×40，同一枚月亮。</p>
</main>
</body>
</html>
