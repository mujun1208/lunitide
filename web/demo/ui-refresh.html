<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lunitide 界面提案</title>
<style>
  :root {
    --bg: #0e1014;
    --side: #12141a;
    --ink: #e7edf6;
    --muted: #8d98a8;
    --faint: #6d7888;
    --line: rgba(255,255,255,.08);
    --hover: rgba(255,255,255,.06);
    --active: rgba(255,255,255,.09);
    --card: #161922;
    --accent: #d7e2f2;
    --sans: "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .chrome { height: 100%; display: grid; grid-template-rows: 52px 1fr; }
  .top {
    display: flex; align-items: center; gap: 14px; min-width: 0;
    padding: 0 16px; border-bottom: 1px solid var(--line); background: #101218;
  }
  .top small { display: none; }
  .views { flex: 1; min-width: 0; overflow: auto; }
  .mark { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .01em; }
  .mark i { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(160deg, #f2f6ff, #8ea4c4); display: block; }
  .top small { color: var(--muted); font-size: 12px; }
  .views { display: flex; gap: 2px; margin-left: 4px; }
  .views button {
    height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 13px; white-space: nowrap;
  }
  .views button.on { background: var(--active); color: var(--ink); }
  .stage { min-height: 0; }
  .stage > section { display: none; height: 100%; }
  .stage > section.on { display: grid; }
  .app { grid-template-columns: 248px 1fr; height: 100%; }
  aside.nav {
    background: var(--side); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 12px 10px 10px; min-height: 0;
  }
  .modes { display: flex; gap: 4px; padding: 2px; margin-bottom: 12px; border-radius: 10px; background: rgba(255,255,255,.04); }
  .modes span { flex: 1; text-align: center; font-size: 12.5px; padding: 6px 0; border-radius: 8px; color: var(--muted); }
  .modes span.on { background: #1c212c; color: var(--ink); }
  .act {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; height: 34px; padding: 0 10px; margin-bottom: 2px;
    border: 0; border-radius: 8px; background: transparent; color: #d5dde8; font-size: 13.5px; text-align: left;
  }
  .act:hover, .row:hover { background: var(--hover); }
  .act kbd { color: var(--faint); font-size: 11px; font-family: inherit; }
  .group { margin-top: 14px; }
  .group h2 {
    display: flex; align-items: center; gap: 6px;
    margin: 0; padding: 0 10px 6px; font-size: 12px; font-weight: 600; color: #9aa6b6;
  }
  .chev { width: 12px; color: var(--faint); }
  .row {
    display: flex; align-items: center; gap: 8px;
    width: 100%; height: 34px; padding: 0 10px; border: 0; border-radius: 8px;
    background: transparent; color: #d7deea; font-size: 13.5px; text-align: left;
  }
  .row.on { background: var(--active); color: #fff; }
  .row svg, .act svg { flex: none; opacity: .8; }
  .chats { display: flex; flex-direction: column; gap: 1px; max-height: 168px; overflow: auto; }
  .chat-title { color: #c5cedb; font-size: 13px; padding: 7px 10px; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-title:hover { background: var(--hover); }
  .grow { flex: 1; }
  .foot { display: flex; align-items: center; gap: 8px; padding: 8px 8px 2px; border-top: 1px solid var(--line); margin-top: 8px; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: #2a3344; display: grid; place-items: center; font-size: 11px; }
  .foot b { font-size: 12.5px; font-weight: 600; }
  .home { display: grid; place-items: center; padding: 40px 48px 64px; background:
    radial-gradient(900px 420px at 50% 18%, rgba(70,110,80,.28), transparent 60%),
    radial-gradient(700px 380px at 70% 8%, rgba(70,70,140,.22), transparent 55%),
    #0c0e12; }
  .home-card { width: min(760px, 100%); text-align: center; }
  .home-card h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; letter-spacing: -.02em; }
  .home-card p { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
  .composer { text-align: left; border: 1px solid var(--line); border-radius: 16px; background: #1a1c22; padding: 14px 14px 10px; }
  .composer .ph { color: #6e7684; font-size: 14px; min-height: 48px; }
  .composer .bar { display: flex; justify-content: space-between; color: var(--muted); font-size: 12.5px; }
  .pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .pills div { text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: rgba(0,0,0,.25); }
  .pills b { display: block; font-size: 13px; margin-bottom: 4px; }
  .pills span { color: var(--muted); font-size: 12px; line-height: 1.45; }
  .note { margin: 10px 10px 0; color: var(--faint); font-size: 11.5px; line-height: 1.45; }
  .bad-void { height: 220px; margin: 8px 6px; border-radius: 10px; background: #0c0e13; border: 1px dashed rgba(255,255,255,.08); }
  .toggle { margin-left: auto; display: flex; gap: 4px; }
  .toggle button { height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 12px; }
  .toggle button.on { color: var(--ink); border-color: rgba(255,255,255,.18); background: var(--active); }
  .page { height: 100%; overflow: auto; padding: 28px 32px 48px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  .page-head h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
  .page-head p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .ghost, .solid {
    height: 32px; padding: 0 12px; border-radius: 8px; font-size: 13px;
  }
  .ghost { border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .solid { border: 0; background: #e8eef8; color: #12141a; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 18px; }
  .chips button { height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 12.5px; }
  .chips button.on { color: var(--ink); background: rgba(255,255,255,.08); border-color: transparent; }
  .search {
    display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 9px; background: #12141a; color: var(--faint); min-width: 220px; font-size: 13px;
  }
  .shelf { margin-bottom: 22px; }
  .shelf > header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .shelf h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .shelf header span { color: var(--faint); font-size: 12px; }
  .market { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .skill {
    display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center;
    padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card);
  }
  .skill:hover { border-color: rgba(255,255,255,.16); }
  .glyph { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: #1e2430; }
  .skill b { display: block; font-size: 13.5px; font-weight: 600; }
  .skill small { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.4; }
  .skill .src { color: var(--faint); font-size: 11px; margin-top: 4px; }
  .install { height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; font-size: 12.5px; color: #d5dde8; }
  .install:hover { background: var(--hover); }
  .mcp-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .mcp {
    position: relative; min-height: 118px; padding: 14px 14px 12px;
    border: 1px solid var(--line); border-radius: 12px; background: #14171e;
  }
  .mcp:hover { border-color: rgba(255,255,255,.16); }
  .mcp .plus {
    position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 6px;
    border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 14px; line-height: 1;
  }
  .mcp b { display: block; margin-top: 10px; font-size: 13.5px; font-weight: 600; }
  .mcp p { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
  .pm { height: 100%; display: grid; grid-template-columns: 1fr 340px; gap: 28px; padding: 28px 32px; overflow: auto; }
  .pm h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
  .pm .lead { margin: 6px 0 16px; color: var(--muted); font-size: 13px; }
  .proj {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 12px; background: #14171e;
  }
  .proj b { font-size: 14px; font-weight: 600; }
  .proj span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
  .templates { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .templates div { padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: transparent; }
  .templates b { font-size: 13px; }
  .templates span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
  .art {
    position: relative; border-radius: 16px; overflow: hidden; min-height: 280px;
    background: #101218; border: 1px solid var(--line); align-self: start;
  }
  .art svg { display: block; width: 100%; height: auto; }
  .art .find {
    position: absolute; right: 16px; bottom: 16px; left: 16px;
    display: flex; align-items: center; height: 36px; padding: 0 12px;
    border-radius: 10px; border: 1px solid rgba(255,255,255,.12); background: rgba(12,14,18,.72);
    color: #9aa3b2; font-size: 13px;
  }
  .tiny { margin-top: 18px; color: var(--faint); font-size: 12px; }
  @media (max-width: 1100px) {
    .market, .mcp-grid { grid-template-columns: 1fr 1fr; }
    .pm { grid-template-columns: 1fr 280px; padding: 20px; }
    .pills { grid-template-columns: 1fr; }
    .home { padding: 28px 20px; }
  }
  .work-main { background: #0c0e12; }
</style>
</head>
<body>
<div class="chrome">
  <header class="top">
    <div class="mark"><i></i>Lunitide</div>
    <small>界面提案 · 看过合适再换进产品</small>
    <nav class="views" aria-label="提案页面">
      <button class="on" data-view="chat">Chat 侧栏</button>
      <button data-view="work">Work 侧栏</button>
      <button data-view="skills">技能市场</button>
      <button data-view="mcp">MCP</button>
      <button data-view="pm">项目管理</button>
    </nav>
    <div class="toggle" id="compare" hidden>
      <button class="on" data-mode="next">提案</button>
      <button data-mode="now">现在</button>
    </div>
  </header>
  <div class="stage">
    <section id="chat" class="on app">
      <aside class="nav" id="chat-nav"></aside>
      <div class="home">
        <div class="home-card">
          <h1>今天想聊什么？</h1>
          <p>直接开始对话。需要写文件时再下手，再送入队列。</p>
          <div class="composer">
            <div class="ph">向月汐提问，或描述你想完成的事情。</div>
            <div class="bar"><span>＋　完全访问</span><span>GLM-5.3</span></div>
          </div>
          <div class="pills">
            <div><b>月伴对话</b><span>纯语音交流：听我说、问问题、像聊天一样。</span></div>
            <div><b>项目管理</b><span>创建、立项和项目任务清单。</span></div>
            <div><b>恢复对话</b><span>打开最近一次未结束的对话。</span></div>
          </div>
        </div>
      </div>
    </section>
    <section id="work" class="app">
      <aside class="nav" id="work-nav"></aside>
      <div class="work-main"></div>
    </section>
    <section id="skills">
      <div class="page" id="skills-page"></div>
    </section>
    <section id="mcp">
      <div class="page" id="mcp-page"></div>
    </section>
    <section id="pm">
      <div class="pm" id="pm-page"></div>
    </section>
  </div>
</div>
<script>
const office = [
  ['办公工作台','文档、表格、演示文稿'],
  ['自动化','定时与流程'],
  ['媒体中心','图片、音频与成片'],
  ['同事聊天','团队消息'],
  ['会议记录','纪要与待办'],
  ['产品总览','版本与能力']
];
const tools = ['项目管理','技能中心','专家中心','MCP','插件','资产管理'];
const skills = [
  ['文','文档写作','按版式写出 Word，保留标题、表格和批注。','Lunitide · 办公','内容'],
  ['演','演示文稿','生成可放映的幻灯片，而不是一页说明。','Lunitide · 办公','内容'],
  ['表','数据表格','整理指标、公式和可筛选的工作表。','Lunitide · 办公','数据'],
  ['会','会议纪要','把讨论收成结论、负责人和下一步。','Lunitide · 办公','效率'],
  ['设','界面设计','按产品气质出界面，而不是通用模板。','Anthropic','设计'],
  ['思','头脑风暴','先把问题问清楚，再决定做什么。','社区','效率'],
  ['技','技能创建','把一次成功的做法收成可复用技能。','Anthropic','开发'],
  ['阅','代码评审','看正确性、边界和回归，不改无关代码。','社区','开发'],
  ['网','网页测试','在真实页面上点通主路径。','社区','开发'],
  ['查','数据查询','用 SQL 看本地表，先出结论再出图。','DuckDB','数据'],
  ['前','前端实践','减少请求瀑布和多余打包。','Vercel','开发'],
  ['安','安全检查','对照常见风险看入口和权限。','社区','开发']
];
const mcps = [
  ['文件夹','工作区文件','读写当前项目里的文档和代码，路径留在工作区内。'],
  ['浏览','桌面浏览器','打开页面、读取内容和继续点击。'],
  ['仓','代码仓库','查看提交、差异和只读历史。'],
  ['搜','网页检索','按问题找公开资料，并标出来源。'],
  ['库','本地数据','查询项目里的表和导出结果。'],
  ['历','日历日程','读取会议时间，方便写纪要。'],
  ['邮','邮件草稿','根据讨论起草邮件，发送前确认。'],
  ['图','图像理解','看截图和设计稿里的文字与布局。']
];
const icon = (d) => `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">${d}</svg>`;
const icons = {
  doc: icon('<path d="M4 2.5h5.2L12 5.2V13.5H4z"/><path d="M9 2.8V5.4h2.4"/>'),
  clock: icon('<circle cx="8" cy="8" r="5.2"/><path d="M8 5.2V8l2 1.4"/>'),
  media: icon('<path d="M3 11.5V4.5l10 3.5z"/>'),
  chat: icon('<path d="M3 4.2h10v6.2H6.2L3 12.2z"/>'),
  meet: icon('<circle cx="8" cy="8" r="5"/><path d="M8 5.4V8h2.2"/>'),
  hub: icon('<path d="M8 2.8l4.2 2.4v4.8L8 12.4 3.8 10V5.2z"/>')
};
const officeIcons = [icons.doc, icons.clock, icons.media, icons.chat, icons.meet, icons.hub];

function sidebarChat(mode) {
  const huge = mode === 'now';
  const rows = office.map((item, i) => `<button class="row${i===0?' on':''}">${officeIcons[i]}${item[0]}</button>`).join('');
  return `
    <div class="modes"><span class="on">Chat</span><span>Work</span></div>
    <button class="act">＋ 新对话<kbd>Ctrl N</kbd></button>
    <button class="act">搜索<kbd>Ctrl K</kbd></button>
    <div class="group"><h2><span class="chev">›</span>对话</h2>
      <div class="chats">
        <div class="chat-title">月伴对话</div>
        <div class="chat-title">试用技能：POC 快速构建</div>
        <div class="chat-title">帮我找一个爱情电影</div>
      </div>
    </div>
    ${huge ? '<div class="bad-void" title="现在这块被拉高，菜单被顶到很远"></div>' : ''}
    <div class="group"><h2><span class="chev">⌄</span>办公</h2>${rows}</div>
    <p class="note">${huge ? '现在：对话区被 flex 拉成一大块空白，办公菜单被挤到很下面。' : '提案：对话按内容高度排列，办公紧跟在下面。字号 13.5，行高 34。'}</p>
    <div class="grow"></div>
    <div class="foot"><span class="avatar">Mu</span><b>Mr.Mu</b></div>`;
}
function sidebarWork(mode) {
  const tiny = mode === 'now';
  const style = tiny ? ' style="height:22px;font-size:11px;color:#7d8b9c"' : '';
  const head = tiny ? ' style="font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#6f7f93"' : '';
  const rows = tools.map((name, i) => `<button class="row"${style}><span style="width:6px;height:6px;border-radius:50%;background:${i===3?'#3bd6a0':'#3a4556'}"></span>${name}</button>`).join('');
  return `
    <div class="modes"><span>Chat</span><span class="on">Work</span></div>
    <button class="act">＋ 新对话</button>
    <div class="group"><h2>历史对话</h2>
      <div class="chat-title">Cursor</div>
      <div class="chat-title">Codex</div>
      <div class="chat-title">Kimi</div>
    </div>
    <div class="group"><h2${head}><span class="chev">⌄</span>项目</h2>${rows}</div>
    <p class="note">${tiny ? '现在：分组 9px、条目 11px，挤在一起，和 Chat 里的办公不是同一套字。' : '提案：和办公同一套字。分组 12px，条目 13.5px，行高 34，可折叠。'}</p>
    <div class="grow"></div>
    <div class="foot"><span class="avatar">Mu</span><b>Mr.Mu</b></div>`;
}

function renderSkills() {
  const cats = ['全部','内容','设计','开发','数据','效率'];
  document.getElementById('skills-page').innerHTML = `
    <div class="page-head"><div><h1>技能市场</h1><p>本机可安装的技能。每条都有标记、名称和一句话用途。</p></div><button class="solid">＋ 添加技能</button></div>
    <div class="chips">${cats.map((c,i)=>`<button class="${i===0?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div>
    <div class="shelf"><header><h2>精选</h2><span>办公与日常最常用</span></header>
      <div class="market" id="skill-grid"></div>
    </div>`;
  const grid = document.getElementById('skill-grid');
  const paint = (cat) => {
    const list = skills.filter(s => cat === '全部' || s[4] === cat);
    grid.innerHTML = list.map(s => `
      <article class="skill">
        <span class="glyph" aria-hidden="true">${s[0]}</span>
        <div><b>${s[1]}</b><small>${s[2]}</small><div class="src">${s[3]}</div></div>
        <button class="install" type="button">安装</button>
      </article>`).join('');
  };
  paint('全部');
  document.querySelectorAll('#skills-page .chips button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#skills-page .chips button').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      paint(btn.dataset.cat);
    };
  });
}
function renderMcp() {
  document.getElementById('mcp-page').innerHTML = `
    <div class="page-head"><div><h1>MCP</h1><p>连接本机能力。图标、名称、用途放在同一张卡片上。</p></div><div class="search">搜索 MCP</div></div>
    <div class="mcp-grid">${mcps.map(m => `
      <article class="mcp">
        <span class="glyph" aria-hidden="true">${m[0].slice(0,1)}</span>
        <button class="plus" type="button" aria-label="添加 ${m[1]}">+</button>
        <b>${m[1]}</b>
        <p>${m[2]}</p>
      </article>`).join('')}</div>`;
}
function renderPm() {
  document.getElementById('pm-page').innerHTML = `
    <div>
      <h1>项目</h1>
      <p class="lead">多人协作，把阶段留在同一处。</p>
      <button class="solid">＋ 新建项目</button>
      <h2 style="margin:22px 0 10px;font-size:13px;color:#9aa6b6;font-weight:600">我的项目</h2>
      <article class="proj"><div><b>项目新手指引</b><span>更新于 2 个月前</span></div></article>
      <article class="proj"><div><b>在线商城实施</b><span>ITM00018 · 立项 · 计划至 6 月</span></div></article>

let mode = 'next';
function paintSides() {
  document.getElementById('chat-nav').innerHTML = sidebarChat(mode);
  document.getElementById('work-nav').innerHTML = sidebarWork(mode);
}
paintSides();
renderSkills();
renderMcp();
renderPm();

const compare = document.getElementById('compare');
document.querySelectorAll('.views button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.views button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    document.querySelectorAll('.stage > section').forEach(s => s.classList.remove('on'));
    document.getElementById(btn.dataset.view).classList.add('on');
    compare.hidden = btn.dataset.view !== 'chat' && btn.dataset.view !== 'work';
  };
});
compare.querySelectorAll('button').forEach(btn => {
  btn.onclick = () => {
    compare.querySelectorAll('button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    mode = btn.dataset.mode;
    paintSides();
  };
});
