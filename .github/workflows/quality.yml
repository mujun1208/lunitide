name: Quality
on: [push, pull_request]
permissions:
  contents: read

jobs:
  windows-quality:
    name: Windows quality and schema drift
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix web ci
      - name: Verify generated Bridge and RPC contracts
        run: npm run verify:bridge
      - name: Test Go
        # The per-package default is 10 minutes. internal/storage/sqlite alone
        # runs two minutes on a developer machine because most of its tests
        # open a fresh database and replay every migration, and a hosted runner
        # is several times slower than that. An explicit budget keeps a slow
        # runner from being reported as a hang.
        run: go test -timeout 20m ./...
      - name: Test authentic Electron credential adoption
        run: npm run test:electron-adoption:e2e
      - name: Vet Go
        run: go vet ./...
      - name: Build Go without CGO
        run: go build ./...
      - name: Generate Renderer contracts
        run: npm --prefix web run generate:bridge
      - name: Typecheck Renderer
        run: npm --prefix web run typecheck
      - name: Test Renderer
        run: npm --prefix web test
      - name: Build Renderer
        run: npm --prefix web run build
      - name: Reject generated-file drift
        run: git diff --exit-code -- web/src/generated/bridge.ts internal/bridge/schema_generated.go internal/contract/schema_generated_test.go

  windows-cgo-race:
    name: Windows CGO race detector
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned MinGW toolchain
        run: choco install mingw --version=13.2.0 --yes --no-progress
      - name: Select MinGW compiler
        shell: pwsh
        run: |
          # Only the roots chocolatey unpacks the pinned package into, so the
          # toolchain stays the one the step above installed rather than
          # whatever gcc the runner image happens to ship.
          $roots = @('C:\ProgramData\mingw64', 'C:\ProgramData\chocolatey\lib\mingw\tools')
          $gcc = $roots |
            Where-Object { Test-Path $_ } |
            ForEach-Object { Get-ChildItem $_ -Filter gcc.exe -Recurse -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $gcc) { throw "Pinned MinGW gcc.exe was not found under: $($roots -join ', ')" }
          $gcc.Directory.FullName | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=$($gcc.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & $gcc.FullName --version
      - name: Run Go race tests
        # Measured locally, race instrumentation costs this tree about 23x:
        # internal/workspace goes from 18s to 415s. Most of the suite is
        # dominated by tests that open a fresh database, and the pure-Go SQLite
        # driver is exactly the kind of allocation-heavy code the detector
        # punishes hardest. That puts internal/app (140s) and
        # internal/storage/sqlite (118s) near an hour each, which is why they
        # blew the 10-minute default; in every timeout the test in flight had
        # been running seconds, so the packages are slow, not stuck. Packages
        # run concurrently, so the job costs about one of them, not their sum.
        run: go test -race -timeout 90m ./...
      - name: Race-test authentic Electron credential adoption
        shell: pwsh
        run: ./test/electron-safe-storage/run-adoption-e2e.ps1 -Race
