name: Release candidate
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run verify:bridge
      - name: Reject MiniCPM-o / Comni in Setup layout
        shell: pwsh
        run: ./release/Test-OmniExcluded.ps1
        # Same budget as the Quality workflow: the per-package default of ten
        # minutes is under what a hosted runner needs for the packages that
        # replay migrations, and a release must not fail for being slow.
      - run: go test -timeout 20m ./...
      - run: go vet ./...
      - run: go build ./...
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test -- --run
      - run: npm --prefix web run build
      - name: Reject generated-file drift
        run: git diff --exit-code -- web/src/generated/bridge.ts internal/bridge/schema_generated.go internal/contract/schema_generated_test.go

  windows-cgo-race:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: choco install mingw --version=13.2.0 --yes --no-progress
      - name: Select MinGW compiler
        shell: pwsh
        run: |
          # Both roots chocolatey unpacks the pinned package into, so the
          # toolchain stays the one the step above installed rather than
          # whatever gcc the runner image happens to ship.
          $roots = @('C:\ProgramData\mingw64', 'C:\ProgramData\chocolatey\lib\mingw\tools')
          $gcc = $roots |
            Where-Object { Test-Path $_ } |
            ForEach-Object { Get-ChildItem $_ -Filter gcc.exe -Recurse -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $gcc) { throw "Pinned MinGW gcc.exe was not found under: $($roots -join ', ')" }
          $gcc.Directory.FullName | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=$($gcc.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & $gcc.FullName --version
        # Race instrumentation costs this tree about 23x, which puts the
        # heaviest packages near an hour. Matches the Quality workflow.
        # cmd/desktop tests are //go:build !race — see quality.yml.
      - run: go test -race -timeout 90m ./...

  x64-release-candidate:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    needs: [quality, windows-cgo-race]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Verify tag matches VERSION
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          if($env:GITHUB_REF_NAME -cne "v$version"){throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version"}
      - name: Build unsigned candidate
        if: github.ref_type != 'tag'
        shell: pwsh
        run: ./release/Build-Release.ps1 -AllowUnsignedDevelopment
      - name: Build signed tagged candidate
        if: github.ref_type == 'tag'
        shell: pwsh
        run: ./release/Build-Release.ps1 -RequireSignature
        env:
          LUNITIDE_SIGN_COMMAND: ${{ secrets.LUNITIDE_SIGN_COMMAND }}
          LUNITIDE_SIGNER_THUMBPRINT: ${{ secrets.LUNITIDE_SIGNER_THUMBPRINT }}
      - name: Verify staged manifest and layout
        shell: pwsh
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          ./release/Verify-Layout.ps1 -Stage "release/out/Lunitide-$version-x64" -Version $version -VerifyManifest
      - name: Install, upgrade, retain and purge acceptance (disposable runner user)
        shell: pwsh
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          $signer=if($env:GITHUB_REF_TYPE -eq 'tag'){$env:LUNITIDE_SIGNER_THUMBPRINT}else{''}
          $installer="Lunitide-Setup-$version-x64.exe"
          $line=Get-Content release/out/SHA256SUMS.txt | Where-Object {$_ -match "  $([regex]::Escape($installer))$"}
          if(@($line).Count -ne 1 -or $line -notmatch '^([0-9a-f]{64})  '){throw 'Trusted release manifest does not contain exactly one installer hash'}
          $unsignedArgs=if($env:GITHUB_REF_TYPE -eq 'tag'){@()}else{@('-AllowUnsignedDevelopment')}
          $fixedDrive=Get-CimInstance Win32_LogicalDisk | Where-Object DriveType -eq 3 | Sort-Object DeviceID | Select-Object -Last 1
          if(-not $fixedDrive){throw 'No local fixed drive is available for selected-directory acceptance'}
          $selected=Join-Path ($fixedDrive.DeviceID+'\') 'Lunitide-Acceptance\Lunitide'
          ./release/Test-Install.ps1 -Installer "release/out/$installer" -ExpectedVersion $version -ExpectedInstallerHash $Matches[1] -InstallDirectory $selected -TestRoot "$env:RUNNER_TEMP\lunitide-acceptance" -ExpectedSignerThumbprint $signer @unsignedArgs
        env:
          LUNITIDE_SIGNER_THUMBPRINT: ${{ secrets.LUNITIDE_SIGNER_THUMBPRINT }}
      - name: Reverify staged artifact before upload
        shell: pwsh
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          $unsignedArgs=if($env:GITHUB_REF_TYPE -eq 'tag'){@()}else{@('-AllowUnsignedDevelopment')}
          $signer=if($env:GITHUB_REF_TYPE -eq 'tag'){$env:LUNITIDE_SIGNER_THUMBPRINT}else{''}
          ./release/Verify-Release.ps1 -OutputRoot release/out -Version $version -ExpectedSignerThumbprint $signer @unsignedArgs
        env:
          LUNITIDE_SIGNER_THUMBPRINT: ${{ secrets.LUNITIDE_SIGNER_THUMBPRINT }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lunitide-x64-${{ github.sha }}
          path: |
            release/out/Lunitide-*-x64/**
            release/out/Lunitide-Setup-*-x64.exe
            release/out/SHA256SUMS.txt
          if-no-files-found: error
