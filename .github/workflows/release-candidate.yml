name: Release candidate
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run verify:bridge
      - run: go test ./...
      - run: npm run test:electron-adoption:e2e
      - run: go vet ./...
      - run: go build ./...
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test -- --run
      - run: npm --prefix web run build
      - name: Reject generated-file drift
        run: git diff --exit-code -- web/src/generated/bridge.ts internal/bridge/schema_generated.go internal/contract/schema_generated_test.go

  windows-cgo-race:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: choco install mingw --version=13.2.0 --yes --no-progress
      - name: Select MinGW compiler
        shell: pwsh
        run: |
          $gcc = Get-ChildItem C:\ProgramData\chocolatey\lib\mingw\tools -Filter gcc.exe -Recurse | Select-Object -First 1
          if (-not $gcc) { throw "Pinned MinGW gcc.exe was not installed" }
          $gcc.Directory.FullName | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=$($gcc.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - run: go test -race ./...

  x64-release-candidate:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    needs: [quality, windows-cgo-race]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Verify tag matches VERSION
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          if($env:GITHUB_REF_NAME -cne "v$version"){throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version"}
      - name: Build unsigned candidate
        if: github.ref_type != 'tag'
        shell: pwsh
        run: ./release/Build-Release.ps1 -AllowUnsignedDevelopment
      - name: Build signed tagged candidate
        if: github.ref_type == 'tag'
        shell: pwsh
        run: ./release/Build-Release.ps1 -RequireSignature
        env:
          LUNITIDE_SIGN_COMMAND: ${{ secrets.LUNITIDE_SIGN_COMMAND }}
          LUNITIDE_SIGNER_THUMBPRINT: ${{ secrets.LUNITIDE_SIGNER_THUMBPRINT }}
      - name: Verify staged manifest and layout
        shell: pwsh
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          ./release/Verify-Layout.ps1 -Stage "release/out/Lunitide-$version-x64" -Version $version -VerifyManifest
      - name: Install, upgrade, retain and purge acceptance (disposable runner user)
        shell: pwsh
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          ./release/Test-Install.ps1 -Installer "release/out/Lunitide-Setup-$version-x64.exe" -ExpectedVersion $version -TestRoot "$env:RUNNER_TEMP\lunitide-acceptance"
      - name: Reverify staged artifact before upload
        shell: pwsh
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          ./release/Verify-Layout.ps1 -Stage "release/out/Lunitide-$version-x64" -Version $version -VerifyManifest
      - uses: actions/upload-artifact@v4
        with:
          name: lunitide-x64-${{ github.sha }}
          path: |
            release/out/Lunitide-*-x64/**
            release/out/Lunitide-Setup-*-x64.exe
            release/out/SHA256SUMS.txt
          if-no-files-found: error
